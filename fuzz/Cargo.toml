[package]
name = "ml-dsa-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
ml-dsa = { path = "../ml-dsa" }

[[bin]]
name = "pk_decode"
path = "fuzz_targets/pk_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sig_decode"
path = "fuzz_targets/sig_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sk_decode"
path = "fuzz_targets/sk_decode.rs"
test = false
doc = false
bench = false

# Detach from the parent workspace (cargo-fuzz convention).
[workspace]
